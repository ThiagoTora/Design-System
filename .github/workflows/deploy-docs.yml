name: Deploy docs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Tokens
        run: npm run build --workspace=@ignite-ui/tokens

      - name: Build React
        run: npm run build --workspace=@ignite-ui/react

      - name: Build Storybook
        working-directory: ./packages/docs
        run: npm run build-storybook 

      - name: Deploy storybook
        working-directory: ./packages/docs
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          npx storybook-to-ghpages \
            --ci \
            --existing-output-dir=storybook-static \
            --remote-url https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git